name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  vscode:
    name: In VS Code (${{ matrix.vscode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest release the manifest accepts, and the newest.
        vscode: ["1.104.0", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # The guardrails test runs the real `otari` command, from otari's latest release.
      - name: Install the otari command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo mozilla-ai/otari --json tagName --jq .tagName)
          uv tool install "https://github.com/mozilla-ai/otari/releases/download/${tag}/otari_agent-${tag#v}.tar.gz"
          otari --version
      - run: npm ci
      - name: Guardrail findings in Problems
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - name: Sign in, chat and a tool call against the mock gateway
        run: xvfb-run -a npm run test:e2e
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
