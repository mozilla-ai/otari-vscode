name: Release

# Push a tag that matches package.json's version (`v0.1.3`) to release it. The VSIX is attached to a GitHub
# release, and published to the Visual Studio Marketplace and Open VSX when their tokens are configured.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: The tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  github:
    name: GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the CHANGELOG section for this version.
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version}" '$0 == heading {found=1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" ./*.vsix --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag

  marketplace:
    name: Visual Studio Marketplace
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::notice::VSCE_PAT is not set in the marketplace environment; skipping the Marketplace."
            exit 0
          fi
          npx --yes @vscode/vsce@3.9.2 publish --packagePath ./*.vsix

  open-vsx:
    name: Open VSX
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "::notice::OVSX_PAT is not set in the marketplace environment; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx@1.4.0 publish ./*.vsix --pat "${OVSX_PAT}"
