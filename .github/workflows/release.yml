name: Release

# Push a tag that matches package.json's version (`v0.1.3`) to release it: the VSIX is attached to a GitHub
# release and published to Open VSX and the Visual Studio Marketplace. Open VSX is skipped with a notice until
# OVSX_PAT is set in the `open-vsx` environment. The Marketplace needs no secret: the mozilla-ai publisher has a
# Trusted Publishing policy for this workflow in the `vs-marketplace` environment.
#
# Run it by hand with a tag to publish that tag again, for example after adding a token. A registry that
# already has the version is left alone, so running it twice is safe.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as v0.1.3
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: The tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  github:
    name: GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ./*.vsix --clobber
            exit 0
          fi
          # The release notes are the CHANGELOG section for this version.
          awk -v heading="## ${TAG#v}" '$0 == heading {found=1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          gh release create "${TAG}" ./*.vsix --title "${TAG}" --notes-file notes.md --verify-tag

  open-vsx:
    name: Open VSX
    needs: package
    runs-on: ubuntu-latest
    environment: open-vsx
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "::notice::OVSX_PAT is not set in the open-vsx environment; skipping Open VSX."
            exit 0
          fi
          vsix=$(ls ./*.vsix)
          manifest=$(unzip -p "${vsix}" extension/package.json)
          namespace=$(jq -r .publisher <<<"${manifest}")
          name=$(jq -r .name <<<"${manifest}")
          version=$(jq -r .version <<<"${manifest}")
          ovsx() { npx --yes ovsx@1.4.0 "$@"; }

          if curl -fsS -o /dev/null "https://open-vsx.org/api/${namespace}/${name}/${version}"; then
            echo "::notice::${namespace}.${name} ${version} is already on Open VSX."
            exit 0
          fi
          if ! curl -fsS -o /dev/null "https://open-vsx.org/api/${namespace}"; then
            ovsx create-namespace "${namespace}" --pat "${OVSX_PAT}"
          fi
          if ! ovsx verify-pat "${namespace}" --pat "${OVSX_PAT}"; then
            echo "::error::The OVSX_PAT account cannot publish to the ${namespace} namespace on Open VSX. A member of the namespace can add it at https://open-vsx.org/user-settings/namespaces; otherwise claim the namespace: https://github.com/EclipseFdn/open-vsx.org/wiki/Namespace-Access"
            exit 1
          fi
          ovsx publish "${vsix}" --pat "${OVSX_PAT}"
          echo "::notice::Published https://open-vsx.org/extension/${namespace}/${name}/${version}"

  vs-marketplace:
    name: Visual Studio Marketplace
    needs: package
    runs-on: ubuntu-latest
    environment: vs-marketplace
    # The mozilla-ai publisher trusts this workflow in this environment, so the OIDC token is the credential.
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish
        # --skip-duplicate keeps a second run of the same tag from failing.
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath ./*.vsix --skip-duplicate
